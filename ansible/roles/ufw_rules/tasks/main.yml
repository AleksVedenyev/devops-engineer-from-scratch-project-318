- name: Allow UFW ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
    from_ip: "{{ item.from_ip | default('any') }}"
  loop: "{{ ufw_rules_ufw_allowed_ports }}"

- name: Deny everything and enable UFW
  community.general.ufw:
    policy: deny
    state: enabled
