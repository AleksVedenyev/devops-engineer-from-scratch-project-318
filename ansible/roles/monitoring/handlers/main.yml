- name: Prometheus reload config
  ansible.builtin.command:
    cmd: docker kill --signal=SIGHUP prometheus
  changed_when: true

- name: Grafana restart
  community.docker.docker_container:
    name: grafana
    state: started
    restart: true

- name: Loki restart
  community.docker.docker_container:
    name: loki
    state: started
    restart: true
