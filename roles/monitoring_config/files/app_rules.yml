groups:
  - name: app_alerts
    rules:
      - alert: AppDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Приложение {{ $labels.instance }} недоступно"
          description: "Экспортер на {{ $labels.instance }} (job={{ $labels.job }}) не отвечает в течение 2 минут. Проверьте: ping {{ $labels.instance }}"